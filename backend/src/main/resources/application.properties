# ===================================================================
# SMART KISAAN - Spring Boot Configuration
# ===================================================================
server.port=8080
server.servlet.context-path=/api

# MySQL Database Configuration (Environment Driven - Never hardcode)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/smartkisaan_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:smartkisaan_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:secret_password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
smartkisaan.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://smartkisaan.app}

# SMS OTP Provider Config (e.g. Fast2SMS / Twilio / NIC e-Gov)
smartkisaan.sms.provider=${SMS_PROVIDER:FAST2SMS}
smartkisaan.sms.api-key=${SMS_API_KEY:}
smartkisaan.sms.sender-id=${SMS_SENDER_ID:SMTKIS}

# AI Advisory Service
smartkisaan.ai.api-key=${GEMINI_API_KEY:}
smartkisaan.ai.model=gemini-3.8-flash

# JWT Secret for Farmer Session
smartkisaan.jwt.secret=${JWT_SECRET:smartkisaan_secret_jwt_key_2026_super_secure_random_seed_key}
smartkisaan.jwt.expiration-ms=2592000000
